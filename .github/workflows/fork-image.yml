name: Fork Images

# Builds the household fork images for self-hosting (cookbook.jakob-kroemer.de).
on:
  push:
    branches:
      - mealie-next
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - '.devcontainer/**'
      - '.vscode/**'
      - 'integrations/health-ios/**'
  workflow_dispatch:

concurrency:
  group: fork-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  mealie:
    name: Mealie image
    if: github.repository != 'mealie-recipes/mealie'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          target: production
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/jferisk/mealie:next
            ghcr.io/jferisk/mealie:sha-${{ github.sha }}
          build-args: |
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=mealie
          cache-to: type=gha,mode=max,scope=mealie

  mcp:
    name: Household MCP image
    if: github.repository != 'mealie-recipes/mealie'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./integrations/mcp
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/jferisk/mealie-mcp:next
            ghcr.io/jferisk/mealie-mcp:sha-${{ github.sha }}
          cache-from: type=gha,scope=mcp
          cache-to: type=gha,mode=max,scope=mcp
