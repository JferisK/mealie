name: MealieHealth
options:
  bundleIdPrefix: de.jakob-kroemer
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_NSHealthShareUsageDescription: 'Synchronise selected measurements with your own Mealie server for personal nutrition goal reviews.'
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_CFBundleDisplayName: 'Cookbook Health'
targets:
  MealieHealth:
    type: application
    platform: iOS
    sources: [Sources]
    entitlements:
      path: MealieHealth.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.jakob-kroemer.cookbook.health
schemes:
  MealieHealth:
    build:
      targets:
        MealieHealth: all
